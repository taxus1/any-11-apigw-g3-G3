spring:
  application:
    name: apigw
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  # 访问流水落库的数据源（库表 gw_access_log 已建好，DDL 见 resources/db/access_log.mysql.sql）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/apigw?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: apigw-db-pool
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 2s
      # 流水是旁路：池里借不到连接快速失败即可（写侧丢日志、查侧报错），不长时间占线程
      max-lifetime: 30m
  cloud:
    gateway:
      # 路由定义从我们的 RedisRouteDefinitionRepository 读，不走 yml 静态路由
      discovery:
        locator:
          enabled: false

server:
  port: ${SERVER_PORT:8080}

# 转发链路参数：连不上上游（3s 握手不成）→ 502；上游半天不吭声（10s 不回）→ 504。
# 路由快照事件即时刷新 + 10s 兜底轮询，所以增删改路由不用重启即可生效。
apigw:
  proxy:
    connect-timeout: 3s
    response-timeout: 10s
    route-refresh-interval: 10s
    # 兜底轮询周期（毫秒），与上面的 Duration 保持一致；@Scheduled 只吃 long/字符串
    route-refresh-interval-ms: 10000
  # 访问流水（异步批量落库）。
  # 攒批边界：攒够 200 条或第一条后最多等 1s 必落一次；正常退出给 5s 宽限冲完队列。
  # 入队走 10000 有界队列、非阻塞：队列满宁可丢流水并计数告警，绝不反压转发。
  # 库维护时可置 enabled=false，转发链路零碰库。
  accesslog:
    enabled: ${ACCESSLOG_ENABLED:true}
    table-name: ${ACCESSLOG_TABLE:gw_access_log}
    batch-size: 200
    linger: 1s
    queue-capacity: 10000
    shutdown-wait: 5s
    request-no-header: X-Request-Id
    app-no-header: X-App-No

logging:
  level:
    com.apigw: debug
  # 访问审计日志单独打，便于查账时直接取「进/出两段、traceId 串联」的记录
  group:
    access:
      - access-log
